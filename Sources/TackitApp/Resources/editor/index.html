<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
<style>
  html, body { margin: 0; height: 100%; background: transparent;
    font: 15px -apple-system, BlinkMacSystemFont, "SF Pro", sans-serif; color: #1c1c1e; }
  #editor { padding: 14px 16px; min-height: 100vh; box-sizing: border-box; }
  .ProseMirror { outline: none; min-height: calc(100vh - 28px); caret-color: #F0B90B; }
  .ProseMirror:focus { outline: none; }
  .ProseMirror p.is-editor-empty:first-child::before {
    content: "Type a thought…"; color: #9a9a9e; float: left; height: 0; pointer-events: none; }
  .ProseMirror h1 { font-size: 1.5em; } .ProseMirror h2 { font-size: 1.25em; }
  .ProseMirror pre { background: rgba(120,120,128,0.14); padding: 8px 10px; border-radius: 6px; }
  .ProseMirror ::selection { background: rgba(240,185,11,0.28); }
  html.dark, html.dark body { color: #f2f2f7; }
  html.dark .ProseMirror p.is-editor-empty:first-child::before { color: #8e8e93; }
  html.dark .ProseMirror pre { background: rgba(120,120,128,0.24); }
</style>
</head>
<body>
<div id="editor"></div>
<script src="bundle.js"></script>
</body>
</html>
