name: Release

# Push a tag like v0.0.1 to build and publish a DMG.
#
# Without signing secrets it publishes an UNSIGNED pre-release (Gatekeeper will
# warn on other Macs). Add these repo secrets to get a signed + notarized release:
#   MACOS_CERT_P12          base64 of the Developer ID Application .p12
#   MACOS_CERT_PASSWORD     password for that .p12
#   MACOS_KEYCHAIN_PASSWORD any throwaway password for the temp keychain
#   SIGN_IDENTITY           "Developer ID Application: Your Name (TEAMID)"
#   APPLE_ID                Apple ID email for notarization
#   APPLE_TEAM_ID           10-char team id
#   APPLE_APP_PASSWORD      app-specific password for notarytool
#
# Optional — auto-update the Homebrew tap on stable tags:
#   TAP_TOKEN               token with contents:write on Nigui/homebrew-tap

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  SIGNED: ${{ secrets.SIGN_IDENTITY != '' }}

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Import signing certificate
        if: ${{ env.SIGNED == 'true' }}
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN=build.keychain
          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain
          rm -f cert.p12

      - name: Store notarization credentials
        if: ${{ env.SIGNED == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool store-credentials tackit-notary \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"

      - name: Build (sign + notarize when configured)
        env:
          SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
          NOTARY_PROFILE: ${{ env.SIGNED == 'true' && 'tackit-notary' || '' }}
        run: ./scripts/package.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--generate-notes)
          if [ "$SIGNED" != "true" ]; then flags+=(--prerelease); fi
          gh release create "${GITHUB_REF_NAME}" dist/Tackit.dmg --title "${GITHUB_REF_NAME}" "${flags[@]}"

      - name: Update Homebrew tap (stable tags only)
        if: ${{ secrets.TAP_TOKEN != '' && !contains(github.ref_name, '-') }}
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA="$(shasum -a 256 dist/Tackit.dmg | awk '{print $1}')"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/Nigui/homebrew-tap.git" tap
          sed -i '' -E "s|^  version \".*\"|  version \"${VERSION}\"|" tap/Casks/tackit.rb
          sed -i '' -E "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" tap/Casks/tackit.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git commit -aqm "chore: tackit ${VERSION}"; then git push; else echo "cask already up to date"; fi
